name: Frankentest Qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Frankentest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact checked-out source and test dependencies
        run: python -m pip install ".[test]"
      - name: Qualify composer and declared environment under optimized Python
        run: python -O -B -m pytest tests/test_frankentest.py tests/test_adaptive_coal.py
