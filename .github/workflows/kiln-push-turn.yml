name: Kiln Push Turn

on:
  push:
  workflow_dispatch:
  repository_dispatch:
    types:
      - kiln_staged_adjudication

permissions:
  contents: read

jobs:
  native-tests:
    name: Kiln native baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.client_payload.commit_sha || github.sha }}

      - name: Validate recursive adjudication dispatch
        if: github.event_name == 'repository_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KILN_DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
          KILN_DISPATCH_SHA: ${{ github.event.client_payload.commit_sha }}
        run: |
          set -euo pipefail

          case "$KILN_DISPATCH_BRANCH" in
            kiln/staging-adjudication/*) ;;
            *) echo "Dispatch branch escaped adjudication namespace" >&2; exit 2 ;;
          esac

          test -n "$KILN_DISPATCH_SHA"
          test "$(git rev-parse HEAD)" = "$KILN_DISPATCH_SHA"

          remote_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/$KILN_DISPATCH_BRANCH" \
              --jq '.object.sha'
          )"

          test "$remote_sha" = "$KILN_DISPATCH_SHA"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install project dependencies
        shell: bash
        run: python -m pip install .

      - name: Run strict native tests
        shell: bash
        run: python -W error::ResourceWarning -m unittest discover -s tests

  kiln-turn:
    name: Kiln self-specimen
    needs: native-tests
    if: always()
    uses: ./.github/workflows/kiln-proof.yml
    with:
      adapter: python
      entry: tests
      native_test_result: ${{ needs.native-tests.result }}
      kiln_ref: 55362ad3599e8825937ce462ac0a934f1494cb10
      max_passes: 8
      workers: 1
      until: stable
      python_version: '3.12'
      artifact_retention_days: 30
      specimen_ref: ${{ github.event.client_payload.commit_sha || github.sha }}
