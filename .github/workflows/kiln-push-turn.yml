name: Kiln Push Turn

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln-turn:
    name: Kiln self-specimen
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Establish detached Kiln runtime
        shell: bash
        run: |
          set -o pipefail

          rm -rf /tmp/kiln-package
          rm -rf /tmp/kiln-venv
          rm -rf /tmp/kiln-evidence

          mkdir -p /tmp/kiln-package
          mkdir -p /tmp/kiln-evidence

          git archive --format=tar HEAD | tar -xf - -C /tmp/kiln-package

          python -m venv /tmp/kiln-venv

          /tmp/kiln-venv/bin/python -m pip install --upgrade pip
          /tmp/kiln-venv/bin/python -m pip install /tmp/kiln-package

          /tmp/kiln-venv/bin/kiln --version \
            | tee /tmp/kiln-evidence/kiln-version.txt

      - name: Record specimen identity
        shell: bash
        run: |
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } | tee /tmp/kiln-evidence/github-specimen.txt

      - name: Record host capabilities
        shell: bash
        run: |
          set -o pipefail

          /tmp/kiln-venv/bin/kiln capabilities --json \
            | tee /tmp/kiln-evidence/capabilities.json

      - name: Inspect pushed specimen
        shell: bash
        run: |
          set -o pipefail

          /tmp/kiln-venv/bin/kiln inspect "$GITHUB_WORKSPACE" --json \
            | tee /tmp/kiln-evidence/inspect.json

      - name: Verify pristine target before Kiln
        shell: bash
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Give pushed commit its turn in Kiln
        shell: bash
        env:
          KILN_ADJUDICATION_INBOX: /tmp/kiln-evidence/adjudication-candidates.json
        run: |
          set -o pipefail

          /tmp/kiln-venv/bin/kiln cycle "$GITHUB_WORKSPACE" \
            --adapter python \
            --entry tests \
            --destructive \
            --max-passes 8 \
            --until stable \
            --session-root /tmp/kiln-evidence/session \
            --json \
            | tee /tmp/kiln-evidence/cycle.json

      - name: Verify source preservation
        if: always()
        shell: bash
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Upload Kiln evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiln-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/kiln-evidence
          if-no-files-found: warn
          retention-days: 30
