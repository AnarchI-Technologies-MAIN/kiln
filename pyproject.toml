[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anarchi-kiln"
version = "0.1.4"
description = "Deterministic destructive software testing, reconstruction, fracture analysis, and constructive redesign."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "AnarchI Technologies" }
]
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/AnarchI-Technologies-MAIN/kiln"

[project.scripts]
kiln = "engine.cli:main"

[tool.setuptools]
packages = ["engine", "coal_house"]

[tool.setuptools.package-data]
coal_house = [
    "packs/*/*.json",
    "venvs/*.json",
    "evidence/*/*.csv",
    "evidence/*/*.json",
    "evidence/*.json",
    "evidence/CAPABILITY-MATRIX.md",
]

[tool.setuptools.data-files]
"share/anarchi-kiln/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
